apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
      annotations:
        sidecar.istio.io/logLevel: "debug"
        sidecar.istio.io/componentLogLevel: "misc:debug"
        proxy.istio.io/config: |
          proxyMetadata:
            ISTIO_META_JSON_TRACE: "true"
            ISTIO_META_ACCESS_LOG_FILE: "/var/log/istio/access.log"
            ISTIO_META_ACCESS_LOG_ENCODING: "JSON"
        sidecar.istio.io/userVolumeMount: '[{"name": "istio-logs", "mountPath": "/var/log/istio"}]'  # ✅ Attach PVC to sidecar
    spec:
      volumes:
        - name: service-a-storage
          persistentVolumeClaim:
            claimName: service-a-pvc  # ✅ For application logs
        - name: istio-logs  # ✅ For Istio logs
          persistentVolumeClaim:
            claimName: istio-a-pvc
      containers:
        - name: service-a
          image: tarang412/service-a:latest
          imagePullPolicy: Always
          volumeMounts:
          - name: service-a-storage
            mountPath: /var/log/service-a  # ✅ Application logs
          command: ["/bin/sh", "-c"]
          args:
            - >
              touch /var/log/service-a/service-a.log &&
              /app/service-a | tee -a /var/log/service-a/service-a.log
          ports:
          - containerPort: 8082
          env:
          - name: AUTH0_DOMAIN
            valueFrom:
              secretKeyRef:
                name: auth0-secret
                key: AUTH0_DOMAIN
          - name: AUTH0_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: auth0-secret
                key: AUTH0_CLIENT_ID
          - name: AUTH0_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: auth0-secret
                key: AUTH0_CLIENT_SECRET
          - name: AUTH0_CALLBACK_URL
            valueFrom:
              secretKeyRef:
                name: auth0-secret
                key: AUTH0_CALLBACK_URL

---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  type: ClusterIP
  selector:
    app: service-a
  ports:
    - port: 8082
      targetPort: 8082
