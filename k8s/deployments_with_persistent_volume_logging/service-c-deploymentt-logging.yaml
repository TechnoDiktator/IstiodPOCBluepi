apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-c
  template:
    metadata:
      labels:
        app: service-c
      annotations:
        sidecar.istio.io/logLevel: "debug"  # Set Istio sidecar log level
        sidecar.istio.io/componentLogLevel: "misc:debug"  # Set component log level
        proxy.istio.io/config: |
          proxyMetadata:
          accessLogFile: /var/log/istio/access.log  # Redirect access logs to a file
          accessLogEncoding: JSON  # Log format (JSON or TEXT)
    spec:
      volumes:
        - name: service-c-storage
          persistentVolumeClaim:
            claimName: service-c-pvc  # PVC for Service-C logs
        - name: istio-storage
          persistentVolumeClaim:
            claimName: istio-c-pvc  # PVC for Istio logs
      containers:
        - name: service-c
          image: tarang412/service-c:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: service-c-storage
              mountPath: /var/log/service-c  # Mount PVC for Service-C logs
            - name: istio-storage
              mountPath: /var/log/istio  # Mount PVC for Istio logs (shared with Istio sidecar)
          command: ["/bin/sh", "-c"]
          args:
            - >
              touch /var/log/service-c/service-c.log &&
              /app/service-c | tee -a /var/log/service-c/service-c.log
          ports:
            - containerPort: 8083
          env:
            - name: SERVICE_B_URL
              valueFrom:
                secretKeyRef:
                  name: service-config-secret
                  key: SERVICE_B_URL
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: auth0-secret
                  key: AUTH0_DOMAIN

---
apiVersion: v1
kind: Service
metadata:
  name: service-c
spec:
  type: ClusterIP
  selector:
    app: service-c
  ports:
    - port: 8083
      targetPort: 8083